<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="geomBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>

    <!-- Zone Positive Gradient (Class 1 - Top Right) -->
    <linearGradient id="zonePosGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Zone Negative Gradient (Class 0 - Bottom Left) -->
    <linearGradient id="zoneNegGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="geomShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="axisArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#94a3b8"/>
    </marker>
    <marker id="normalArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="pointerArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#ec4899"/>
    </marker>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="936" height="516" rx="20" fill="url(#geomBgGrad)" stroke="#1e293b" stroke-width="2" filter="url(#geomShadow)"/>

  <!-- Header -->
  <rect x="30" y="22" width="220" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="44" cy="35" r="5" fill="#38bdf8"/>
  <text x="56" y="39" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">GÉOMÉTRIE DE LA DÉCISION</text>

  <text x="30" y="74" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">La Droite de Séparation dans le Plan 2D</text>
  <text x="30" y="96" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Le rôle clé du biais b : décaler la frontière loin de l'origine (0, 0)</text>

  <!-- ================= CARTESIAN PLANE (Left 500px) ================= -->
  <!-- Grid background box -->
  <rect x="40" y="120" width="500" height="360" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="120" y1="120" x2="120" y2="480"/>
    <line x1="180" y1="120" x2="180" y2="480"/>
    <line x1="240" y1="120" x2="240" y2="480"/>
    <line x1="300" y1="120" x2="300" y2="480"/>
    <line x1="360" y1="120" x2="360" y2="480"/>
    <line x1="420" y1="120" x2="420" y2="480"/>
    <line x1="480" y1="120" x2="480" y2="480"/>

    <line x1="40" y1="180" x2="540" y2="180"/>
    <line x1="40" y1="240" x2="540" y2="240"/>
    <line x1="40" y1="300" x2="540" y2="300"/>
    <line x1="40" y1="360" x2="540" y2="360"/>
    <line x1="40" y1="420" x2="540" y2="420"/>
  </g>

  <!-- Shaded Region: Positive (z >= 0) / Class 1 (Top-Right) -->
  <polygon points="40,180 440,480 540,480 540,120 40,120" fill="url(#zonePosGrad)"/>

  <!-- Shaded Region: Negative (z < 0) / Class 0 (Bottom-Left including origin) -->
  <polygon points="40,180 440,480 40,480" fill="url(#zoneNegGrad)"/>

  <!-- Coordinate Axes -->
  <!-- x1 Axis (horizontal) at y=420 -->
  <line x1="70" y1="420" x2="520" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="525" y="425" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">x₁</text>

  <!-- x2 Axis (vertical) at x=120 -->
  <line x1="120" y1="465" x2="120" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="115" y="130" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">x₂</text>

  <!-- Origin (0,0) Clearly Identified -->
  <circle cx="120" cy="420" r="4.5" fill="#94a3b8"/>
  <text x="100" y="438" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">O(0,0)</text>

  <!-- Decision Boundary Line (z = 0) -->
  <!-- Passes through (120, 240) and (440, 480) -->
  <line x1="40" y1="180" x2="440" y2="480" stroke="url(#lineGrad)" stroke-width="3.5" filter="url(#geomShadow)"/>

  <!-- Decision Line Callout Badge -->
  <path d="M 330 425 L 305 385" stroke="#ec4899" stroke-width="1.5" fill="none" marker-end="url(#pointerArrow)"/>
  <rect x="330" y="415" width="135" height="26" rx="6" fill="#1e1329" stroke="#ec4899" stroke-width="1"/>
  <text x="397" y="432" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">Frontière z = 0</text>

  <!-- ================= ACCENTUATED BIAS VISUALIZATION ================= -->
  <!-- Technical dimension bracket along x2-axis showing -b/w2 distance -->
  <line x1="75" y1="420" x2="75" y2="240" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3"/>
  <line x1="70" y1="420" x2="120" y2="420" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="70" y1="240" x2="120" y2="240" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Offset Badge on Bracket -->
  <rect x="46" y="318" width="60" height="24" rx="5" fill="#1f1606" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="76" y="334" font-family="Consolas, monospace" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">b ≠ 0</text>

  <!-- Intercept Point on Axis: (0, -b/w2) at y=240 -->
  <circle cx="120" cy="240" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2" filter="url(#geomShadow)"/>

  <!-- Intercept Label Badge -->
  <rect x="48" y="206" width="100" height="26" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="98" y="223" font-family="Consolas, monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">-b / w₂</text>

  <!-- ================= NORMAL VECTOR w = [w1, w2] ================= -->
  <!-- Originates on line at (240, 330), points perpendicular into Class 1: dx = 75, dy = -100 -->
  <line x1="240" y1="330" x2="315" y2="230" stroke="#38bdf8" stroke-width="3" marker-end="url(#normalArrow)"/>

  <!-- Exact Right-Angle Symbol at (240, 330) -->
  <path d="M 230.4 322.8 L 237.6 313.2 L 247.2 320.4" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Normal Vector Label Badge -->
  <rect x="290" y="195" width="165" height="34" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.2"/>
  <text x="372" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Vecteur normal w</text>
  <text x="372" y="223" font-family="Consolas, monospace" font-size="10" fill="#bae6fd" text-anchor="middle">w = [w₁, w₂] ⊥ Droite</text>

  <!-- ================= DATA SAMPLES ================= -->
  <!-- Class 1 Samples (z > 0) -> Cyan Dots with "1" in Top-Right -->
  <g filter="url(#geomShadow)">
    <circle cx="270" cy="260" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="270" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="350" cy="280" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="350" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="440" cy="180" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="440" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="460" cy="260" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="460" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="380" cy="330" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="380" y="334" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="450" cy="350" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="354" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="320" cy="170" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="320" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Class 0 Samples (z < 0) -> Coral/Rose Dots with "0" in Bottom-Left -->
  <g filter="url(#geomShadow)">
    <circle cx="170" cy="360" r="9" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <text x="170" y="364" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

    <circle cx="230" cy="400" r="9" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <text x="230" y="404" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

    <circle cx="150" cy="445" r="9" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <text x="150" y="449" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

    <circle cx="280" cy="440" r="9" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <text x="280" y="444" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

    <circle cx="145" cy="320" r="9" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <text x="145" y="324" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>
  </g>

  <!-- Zone Badges -->
  <rect x="360" y="140" width="160" height="26" rx="6" fill="#0c4a6e" fill-opacity="0.8" stroke="#0284c7" stroke-width="1"/>
  <text x="440" y="157" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Région Classe 1 (z &gt; 0)</text>

  <rect x="180" y="445" width="150" height="26" rx="6" fill="#881337" fill-opacity="0.8" stroke="#e11d48" stroke-width="1"/>
  <text x="255" y="462" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">Région Classe 0 (z &lt; 0)</text>

  <!-- ================= RIGHT PANEL: EXPLANATIONS (360px) ================= -->
  <!-- Card 1: Équation de la Droite -->
  <g filter="url(#geomShadow)">
    <rect x="560" y="120" width="350" height="76" rx="12" fill="#131d31" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="580" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. Équation de la Frontière (z = 0)</text>
    <rect x="580" y="152" width="310" height="30" rx="6" fill="#0b1220"/>
    <text x="735" y="172" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">w₁ x₁ + w₂ x₂ + b = 0</text>
  </g>

  <!-- Card 2: Forme Cartésienne (Pente & Ordonnée) -->
  <g filter="url(#geomShadow)">
    <rect x="560" y="208" width="350" height="96" rx="12" fill="#131d31" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="580" y="230" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. Forme Affine (y = m·x + p)</text>
    <rect x="580" y="240" width="310" height="30" rx="6" fill="#0b1220"/>
    <text x="735" y="260" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">x₂ = - (w₁ / w₂) x₁ - (b / w₂)</text>
    <text x="580" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">• Pente = <tspan fill="#c084fc" font-weight="600">-w₁/w₂</tspan>   • Ordonnée à l'origine = <tspan fill="#fbbf24" font-weight="600">-b/w₂</tspan></text>
  </g>

  <!-- Card 3: Rôle du Vecteur Normal w -->
  <g filter="url(#geomShadow)">
    <rect x="560" y="316" width="350" height="76" rx="12" fill="#131d31" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="580" y="338" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">3. Rôle du Vecteur Poids w</text>
    <text x="580" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Le vecteur <tspan font-family="Consolas" font-weight="700" fill="#38bdf8">w = [w₁, w₂]</tspan> est orthogonal à la droite.</text>
    <text x="580" y="378" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Il pointe directement vers la zone positive (<tspan fill="#38bdf8">Classe 1</tspan>).</text>
  </g>

  <!-- Card 4: Rôle Crucial du Biais b -->
  <g filter="url(#geomShadow)">
    <rect x="560" y="404" width="350" height="76" rx="12" fill="#131d31" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="580" y="426" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">4. Rôle du Paramètre de Biais b (b ≠ 0)</text>
    <text x="580" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Le biais <tspan font-family="Consolas" font-weight="700" fill="#fbbf24">b</tspan> translate la droite loin de l'origine <tspan fill="#94a3b8">(0,0)</tspan>.</text>
    <text x="580" y="466" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Ici, <tspan fill="#fbbf24" font-weight="600">-b/w₂</tspan> est très nettement décollé de l'axe !</text>
  </g>
</svg>
