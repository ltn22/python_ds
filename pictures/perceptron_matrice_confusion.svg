<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cfCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Cell Success Gradient -->
    <linearGradient id="cellSuccessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Cell Neutral Gradient -->
    <linearGradient id="cellNeutralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="cfDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .panel-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
    .grid-header { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .cell-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #cbd5e1; }
    .cell-val { font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 800; fill: #34d399; }
    .cell-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
    .code-text { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 11.5px; fill: #38bdf8; }
    .label-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 700; fill: #f1f5f9; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect width="980" height="520" fill="url(#cfBgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="980" y2="80"/>
    <line x1="0" y1="160" x2="980" y2="160"/>
    <line x1="0" y1="240" x2="980" y2="240"/>
    <line x1="0" y1="320" x2="980" y2="320"/>
    <line x1="0" y1="400" x2="980" y2="400"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 42)">
    <rect x="-8" y="-18" width="6" height="42" rx="3" fill="#10b981"/>
    <text x="12" y="2" class="title">MATRICE DE CONFUSION &amp; DIAGNOSTIC DES ERREURS (N = 100)</text>
    <text x="12" y="23" class="subtitle">Bilan exhaustif des prédictions sur les deux classes de Blobs après entraînement</text>
  </g>

  <!-- ==================== LEFT PANEL: 2x2 CONFUSION MATRIX ==================== -->
  <g transform="translate(40, 95)" filter="url(#cfDropShadow)">
    <rect width="480" height="390" rx="14" fill="url(#cfCardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Title -->
    <text x="24" y="32" class="panel-title">Structure de la Matrice de Décision</text>

    <!-- Column Headers (Predictions) -->
    <text x="255" y="70" text-anchor="middle" class="grid-header" fill="#38bdf8">PRÉDICTION DU PERCEPTRON (ŷ)</text>
    
    <rect x="140" y="82" width="150" height="26" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="215" y="99" text-anchor="middle" class="grid-header">Prédit 0 (Inactif)</text>

    <rect x="305" y="82" width="150" height="26" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="380" y="99" text-anchor="middle" class="grid-header">Prédit 1 (Actif)</text>

    <!-- Row 1: True Class 0 -->
    <g transform="translate(24, 118)">
      <!-- Row Header -->
      <rect x="0" y="0" width="105" height="110" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="52" y="48" text-anchor="middle" class="grid-header" font-size="11">RÉEL (y)</text>
      <text x="52" y="68" text-anchor="middle" class="label-bold" fill="#38bdf8">Classe 0</text>
      <text x="52" y="86" text-anchor="middle" class="label" font-size="10">(50 pts)</text>

      <!-- Cell 1,1: VRAIS NÉGATIFS (VN) -->
      <g transform="translate(116, 0)">
        <rect width="150" height="110" rx="10" fill="url(#cellSuccessGrad)" stroke="#10b981" stroke-width="1.5"/>
        <text x="75" y="24" text-anchor="middle" class="cell-title" fill="#34d399">VRAIS NÉGATIFS (VN)</text>
        <text x="75" y="64" text-anchor="middle" class="cell-val">50</text>
        <text x="75" y="88" text-anchor="middle" class="cell-sub" fill="#34d399">✓ 100% Corrects</text>
      </g>

      <!-- Cell 1,2: FAUX POSITIFS (FP) -->
      <g transform="translate(281, 0)">
        <rect width="150" height="110" rx="10" fill="url(#cellNeutralGrad)" stroke="#334155" stroke-width="1"/>
        <text x="75" y="24" text-anchor="middle" class="cell-title" fill="#94a3b8">FAUX POSITIFS (FP)</text>
        <text x="75" y="64" text-anchor="middle" class="cell-val" fill="#64748b">0</text>
        <text x="75" y="88" text-anchor="middle" class="cell-sub">Aucune fausse alerte</text>
      </g>
    </g>

    <!-- Row 2: True Class 1 -->
    <g transform="translate(24, 238)">
      <!-- Row Header -->
      <rect x="0" y="0" width="105" height="110" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="52" y="48" text-anchor="middle" class="grid-header" font-size="11">RÉEL (y)</text>
      <text x="52" y="68" text-anchor="middle" class="label-bold" fill="#fb7185">Classe 1</text>
      <text x="52" y="86" text-anchor="middle" class="label" font-size="10">(50 pts)</text>

      <!-- Cell 2,1: FAUX NÉGATIFS (FN) -->
      <g transform="translate(116, 0)">
        <rect width="150" height="110" rx="10" fill="url(#cellNeutralGrad)" stroke="#334155" stroke-width="1"/>
        <text x="75" y="24" text-anchor="middle" class="cell-title" fill="#94a3b8">FAUX NÉGATIFS (FN)</text>
        <text x="75" y="64" text-anchor="middle" class="cell-val" fill="#64748b">0</text>
        <text x="75" y="88" text-anchor="middle" class="cell-sub">Aucun manquement</text>
      </g>

      <!-- Cell 2,2: VRAIS POSITIFS (VP) -->
      <g transform="translate(281, 0)">
        <rect width="150" height="110" rx="10" fill="url(#cellSuccessGrad)" stroke="#10b981" stroke-width="1.5"/>
        <text x="75" y="24" text-anchor="middle" class="cell-title" fill="#34d399">VRAIS POSITIFS (VP)</text>
        <text x="75" y="64" text-anchor="middle" class="cell-val">50</text>
        <text x="75" y="88" text-anchor="middle" class="cell-sub" fill="#34d399">✓ 100% Corrects</text>
      </g>
    </g>

    <!-- Bottom note -->
    <text x="240" y="372" text-anchor="middle" class="label" font-size="11">Total observations testées : N = 50 + 50 = 100 points</text>
  </g>

  <!-- ==================== RIGHT PANEL: METRICS DERIVATION ==================== -->
  <g transform="translate(540, 95)" filter="url(#cfDropShadow)">
    <rect width="400" height="390" rx="14" fill="url(#cfCardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Title -->
    <text x="24" y="32" class="panel-title">Formules Dérivées de la Matrice</text>

    <!-- Block 1: Accuracy -->
    <g transform="translate(24, 52)">
      <rect width="352" height="88" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="16" y="22" class="label-bold" fill="#34d399">1. Précision Globale (Accuracy)</text>
      <text x="16" y="44" class="label" font-size="12">Accuracy = (VN + VP) / Total = (50 + 50) / 100</text>
      <text x="16" y="68" class="code-text" font-size="12"><tspan fill="#ec4899">accuracy_blobs</tspan> = 1.0  <tspan fill="#34d399">(100.0 %)</tspan></text>
    </g>

    <!-- Block 2: Error Rate -->
    <g transform="translate(24, 150)">
      <rect width="352" height="88" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="label-bold" fill="#cbd5e1">2. Taux d'Erreur (Error Rate)</text>
      <text x="16" y="44" class="label" font-size="12">Taux = (FP + FN) / Total = (0 + 0) / 100</text>
      <text x="16" y="68" class="code-text" font-size="12"><tspan fill="#ec4899">taux_erreur</tspan>   = 0.0  <tspan fill="#64748b">(0 erreur / 100)</tspan></text>
    </g>

    <!-- Block 3: Verification in Python -->
    <g transform="translate(24, 248)">
      <rect width="352" height="100" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" class="label-bold" fill="#38bdf8">3. Équivalence Vectorisée NumPy :</text>
      <text x="16" y="44" class="code-text" font-size="11">y_pred = p_blobs.predict(X_blobs)</text>
      <text x="16" y="64" class="code-text" font-size="11">nb_err = np.sum(y_pred != y_blobs)  <tspan fill="#64748b"># -> 0</tspan></text>
      <text x="16" y="84" class="code-text" font-size="11">acc    = np.mean(y_pred == y_blobs) <tspan fill="#34d399"># -> 1.0</tspan></text>
    </g>

    <!-- Bottom summary badge -->
    <g transform="translate(24, 356)">
      <text x="176" y="16" text-anchor="middle" class="label-bold" fill="#34d399" font-size="11.5">✓ Zéro Fausse Alerte, Zéro Omission détectée</text>
    </g>
  </g>
</svg>
