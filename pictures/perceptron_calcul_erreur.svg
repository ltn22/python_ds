<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Success Gradient -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Error Gradient -->
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 21px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.3px; }
    .card-badge { font-family: monospace; font-size: 11px; font-weight: 700; fill: #0284c7; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; }
    .label-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
    .code-text { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 11.5px; fill: #38bdf8; }
    .math-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14.5px; fill: #f8fafc; }
    .success-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #34d399; }
    .error-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #fb7185; }
    .stat-val { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #34d399; }
  </style>

  <!-- Background -->
  <rect width="1020" height="580" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1020" y2="80"/>
    <line x1="0" y1="160" x2="1020" y2="160"/>
    <line x1="0" y1="240" x2="1020" y2="240"/>
    <line x1="0" y1="320" x2="1020" y2="320"/>
    <line x1="0" y1="400" x2="1020" y2="400"/>
    <line x1="0" y1="480" x2="1020" y2="480"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 42)">
    <rect x="-8" y="-18" width="6" height="42" rx="3" fill="#38bdf8"/>
    <text x="12" y="2" class="title">ÉVALUATION &amp; CALCUL DE L'ERREUR DANS LE PERCEPTRON</text>
    <text x="12" y="23" class="subtitle">Du diagnostic unitaire d'échantillon à la précision globale vectorisée (Cas des 100 observations 2D)</text>
  </g>

  <!-- ==================== CARD 1 : ERREUR D'ÉCHANTILLON ==================== -->
  <g transform="translate(40, 95)" filter="url(#dropShadow)">
    <rect width="300" height="450" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="300" height="46" rx="14" fill="#0f172a" fill-opacity="0.6"/>
    <rect x="18" y="14" width="22" height="18" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="29" y="27" text-anchor="middle" class="card-badge">1</text>
    <text x="50" y="28" class="card-title">Erreur d'un Échantillon</text>

    <!-- Formula Box -->
    <g transform="translate(18, 60)">
      <rect width="264" height="44" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="132" y="27" text-anchor="middle" class="math-text">δᵢ = yᵢ − ŷᵢ   (valant −1, 0 ou +1)</text>
    </g>

    <!-- The 4 Cases -->
    <!-- Case 1: Correct 1 -->
    <g transform="translate(18, 118)">
      <rect width="264" height="58" rx="8" fill="url(#successGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="18" r="5" fill="#34d399"/>
      <text x="28" y="21" class="label-bold">y = 1,  ŷ = 1   ➔   δ = 0</text>
      <text x="28" y="42" class="success-text">✓ Bien classé (Aucun ajustement)</text>
    </g>

    <!-- Case 2: Correct 0 -->
    <g transform="translate(18, 186)">
      <rect width="264" height="58" rx="8" fill="url(#successGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="18" r="5" fill="#34d399"/>
      <text x="28" y="21" class="label-bold">y = 0,  ŷ = 0   ➔   δ = 0</text>
      <text x="28" y="42" class="success-text">✓ Bien classé (Aucun ajustement)</text>
    </g>

    <!-- Case 3: False Negative -->
    <g transform="translate(18, 254)">
      <rect width="264" height="66" rx="8" fill="url(#errorGrad)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="18" r="5" fill="#fb7185"/>
      <text x="28" y="21" class="label-bold">y = 1,  ŷ = 0   ➔   δ = +1</text>
      <text x="28" y="38" class="error-text">✗ Sous-estimé (Faux Négatif)</text>
      <text x="28" y="54" class="code-text" font-size="10.5">w += η · xᵢ,   b += η</text>
    </g>

    <!-- Case 4: False Positive -->
    <g transform="translate(18, 330)">
      <rect width="264" height="66" rx="8" fill="url(#errorGrad)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="18" r="5" fill="#fb7185"/>
      <text x="28" y="21" class="label-bold">y = 0,  ŷ = 1   ➔   δ = −1</text>
      <text x="28" y="38" class="error-text">✗ Sur-estimé (Faux Positif)</text>
      <text x="28" y="54" class="code-text" font-size="10.5">w -= η · xᵢ,   b -= η</text>
    </g>

    <!-- Bottom Note -->
    <text x="150" y="428" text-anchor="middle" class="label" font-size="10.5" fill="#64748b">Ajustement séquentiel immédiat dans .fit()</text>
  </g>

  <!-- ==================== CARD 2 : SUIVI PAR ÉPOQUE ==================== -->
  <g transform="translate(360, 95)" filter="url(#dropShadow)">
    <rect width="300" height="450" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Header -->
    <rect x="0" y="0" width="300" height="46" rx="14" fill="#0f172a" fill-opacity="0.6"/>
    <rect x="18" y="14" width="22" height="18" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="29" y="27" text-anchor="middle" class="card-badge">2</text>
    <text x="50" y="28" class="card-title">Comptage par Époque</text>

    <!-- Formula Box -->
    <g transform="translate(18, 60)">
      <rect width="264" height="44" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="132" y="27" text-anchor="middle" class="math-text">E_époque = Σ |δᵢ|  (mises à jour)</text>
    </g>

    <!-- Code Block -->
    <g transform="translate(18, 118)">
      <rect width="264" height="115" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="24" class="code-text" fill="#94a3b8"># Boucle sur 1 époque :</text>
      <text x="14" y="44" class="code-text"><tspan fill="#ec4899">nb_erreurs</tspan> = 0</text>
      <text x="14" y="64" class="code-text"><tspan fill="#f59e0b">if</tspan> delta != 0:</text>
      <text x="34" y="84" class="code-text">nb_erreurs += 1</text>
      <text x="14" y="104" class="code-text">self.<tspan fill="#38bdf8">errors_</tspan>.append(nb_erreurs)</text>
    </g>

    <!-- Convergence Condition -->
    <g transform="translate(18, 245)">
      <rect width="264" height="74" rx="8" fill="#132338" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="22" class="label-bold" fill="#38bdf8">⚡ Condition d'Arrêt Anticipé :</text>
      <text x="14" y="44" class="code-text" fill="#f8fafc"><tspan fill="#f59e0b">if</tspan> nb_erreurs == 0: <tspan fill="#34d399">break</tspan></text>
      <text x="14" y="62" class="label" font-size="10.5" fill="#94a3b8">Convergence atteinte : 100% séparable</text>
    </g>

    <!-- Epoch Trace on Blobs -->
    <g transform="translate(18, 330)">
      <rect width="264" height="88" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" class="label-bold" font-size="11" fill="#cbd5e1">Historique réel sur nos Blobs 2D :</text>
      <text x="14" y="38" class="label" font-size="10.5">• Époque 1 : 1 mise à jour (départ)</text>
      <text x="14" y="54" class="label" font-size="10.5">• Époques 2-25 : 3 à 4 mises à jour</text>
      <text x="14" y="72" class="success-text" font-size="11">✓ Époque 27 : 0 erreur (Arrêt !)</text>
    </g>

    <text x="150" y="428" text-anchor="middle" class="label" font-size="10.5" fill="#64748b">Stocké dans p_blobs.errors_ (taille = 27)</text>
  </g>

  <!-- ==================== CARD 3 : ÉVALUATION GLOBALE ==================== -->
  <g transform="translate(680, 95)" filter="url(#dropShadow)">
    <rect width="300" height="450" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Header -->
    <rect x="0" y="0" width="300" height="46" rx="14" fill="#0f172a" fill-opacity="0.6"/>
    <rect x="18" y="14" width="22" height="18" rx="4" fill="#0284c7" fill-opacity="0.2"/>
    <text x="29" y="27" text-anchor="middle" class="card-badge">3</text>
    <text x="50" y="28" class="card-title">Métriques Globales (N=100)</text>

    <!-- Formula Box -->
    <g transform="translate(18, 60)">
      <rect width="264" height="44" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="132" y="27" text-anchor="middle" class="math-text">Accuracy = (Nb Corrects) / N</text>
    </g>

    <!-- Metric 1: Accuracy Card -->
    <g transform="translate(18, 118)">
      <rect width="264" height="88" rx="8" fill="url(#successGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="16" y="24" class="label-bold" fill="#34d399">Précision Globale (Accuracy)</text>
      <text x="16" y="55" class="stat-val">100.0 %</text>
      <text x="16" y="74" class="code-text" font-size="10.5">accuracy = np.mean(y_pred == y)</text>
    </g>

    <!-- Metric 2: Error Rate -->
    <g transform="translate(18, 218)">
      <rect width="264" height="88" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" class="label-bold" fill="#94a3b8">Taux d'Erreur Global</text>
      <text x="16" y="55" class="stat-val" fill="#f8fafc">0.0 % <tspan font-size="13" font-weight="normal" fill="#64748b">(0 erreur / 100)</tspan></text>
      <text x="16" y="74" class="code-text" font-size="10.5">taux_err = np.mean(y_pred != y)</text>
    </g>

    <!-- Metric 3: Confusion Matrix -->
    <g transform="translate(18, 318)">
      <rect width="264" height="100" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="20" class="label-bold" font-size="11" fill="#38bdf8">Matrice de Confusion 2×2 :</text>
      <text x="14" y="42" class="label" font-size="11">• Vrais Négatifs (VN) : <tspan font-weight="700" fill="#34d399">50 / 50</tspan></text>
      <text x="14" y="60" class="label" font-size="11">• Vrais Positifs (VP)  : <tspan font-weight="700" fill="#34d399">50 / 50</tspan></text>
      <text x="14" y="78" class="label" font-size="11">• Faux Positifs (FP)  : <tspan font-weight="700" fill="#34d399">0</tspan> | FN : <tspan font-weight="700" fill="#34d399">0</tspan></text>
    </g>

    <text x="150" y="428" text-anchor="middle" class="label" font-size="10.5" fill="#64748b">Évaluation vectorisée instantanée</text>
  </g>
</svg>
